apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: web28-slo-alerts
  namespace: app-monitoring
  labels:
    release: monitoring
    org.bstu.owner: "GrafShu"
    org.bstu.student.slug: "feis-576-220253-v28"
spec:
  groups:
    - name: web28-slo
      interval: 30s
      rules:
        - alert: Web28HighErrorRate
          expr: |
            (
              sum(rate(web28_http_requests_total{status=~"5.."}[10m]))
              /
              sum(rate(web28_http_requests_total[10m]))
            ) > 0.025
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "High 5xx error rate detected"
            description: "Error rate is {{ $value | humanizePercentage }} exceeding 2.5%"
        
        - alert: Web28HighLatency
          expr: |
            histogram_quantile(0.95, 
              sum(rate(web28_http_request_duration_seconds_bucket[5m])) by (le)
            ) > 0.385
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High P95 latency detected"
            description: "P95 latency is {{ $value }}s exceeding 0.385s"
        
        - alert: Web28LowAvailability
          expr: |
            (
              sum(rate(web28_http_requests_total{status!~"5.."}[10m]))
              /
              sum(rate(web28_http_requests_total[10m]))
            ) * 100 < 99.2
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Low availability"
            description: "Availability is {{ $value }}% below 99.2%"
