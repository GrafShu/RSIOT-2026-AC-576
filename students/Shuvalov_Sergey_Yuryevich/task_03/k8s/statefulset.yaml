apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: state28
  labels:
    app: redis
    org.bstu.owner: "GrafShu"
    org.bstu.student.slug: "feis-576-220253-v28"
    org.bstu.student.fullname: "Shuvalov-Sergey-Yurevich"
    org.bstu.student.id: "220253"
    org.bstu.group: "feis-576"
    org.bstu.variant: "28"
    org.bstu.course: "RSIOT"
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          command:
            - redis-server
            - --requirepass
            - securepassword123
            - --appendonly
            - "yes"
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            exec:
              command:
                - redis-cli
                - -a
                - securepassword123
                - ping
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - redis-cli
                - -a
                - securepassword123
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          org.bstu.owner: "GrafShu"
          org.bstu.student.slug: "feis-576-220253-v28"
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: redis-ssd
        resources:
          requests:
            storage: 5Gi
